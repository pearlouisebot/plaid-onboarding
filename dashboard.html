<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial DNA — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #09090d;
      color: #f0f0f5;
      min-height: 100vh;
      padding: 28px 16px 60px;
      max-width: 720px;
      margin: 0 auto;
    }

    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .logo { font-size: 26px; }
    .brand { font-size: 18px; font-weight: 700; }
    .brand span { color: #7c6ff7; }

    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .sub { color: #666; font-size: 13px; margin-bottom: 24px; }

    /* Net worth */
    .net-worth {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid #2a2a3a;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      margin-bottom: 28px;
    }
    .nw-label { font-size: 11px; color: #888; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }
    .nw-amount { font-size: 36px; font-weight: 800; color: #7c6ff7; letter-spacing: -1px; }
    .nw-sub { font-size: 12px; color: #555; margin-top: 4px; }

    /* Account section */
    .acct-block { margin-bottom: 32px; }
    .acct-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .acct-name-big { font-size: 15px; font-weight: 700; }
    .acct-meta { font-size: 12px; color: #555; }
    .acct-bal-big { font-size: 18px; font-weight: 800; color: #7c6ff7; }
    .acct-bal-big.negative { color: #ef4444; }

    /* Transaction table */
    .tx-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .tx-table th {
      text-align: left;
      font-size: 11px;
      color: #555;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 0 10px 8px;
      border-bottom: 1px solid #1e1e28;
    }
    .tx-table th:last-child { text-align: right; }
    .tx-table td {
      padding: 9px 10px;
      border-bottom: 1px solid #111118;
      vertical-align: middle;
    }
    .tx-table tr:last-child td { border-bottom: none; }
    .tx-table tr:hover td { background: #111118; }

    .tx-name { font-weight: 500; color: #e0e0f0; }
    .tx-cat  { font-size: 11px; color: #555; margin-top: 2px; }
    .tx-date { color: #555; white-space: nowrap; }
    .tx-amt  { text-align: right; font-weight: 600; white-space: nowrap; }
    .tx-amt.debit  { color: #f0f0f5; }
    .tx-amt.credit { color: #22c55e; }
    .tx-pending { display: inline-block; font-size: 10px; color: #f59e0b;
                  background: #1a1500; border-radius: 4px; padding: 1px 5px; margin-left: 4px; }

    .empty { color: #444; font-size: 13px; padding: 16px 10px; text-align: center; }
    .loading-row td { color: #444; text-align: center; padding: 16px; }

    .section-divider {
      border: none;
      border-top: 1px solid #1a1a24;
      margin: 4px 0 16px;
    }

    /* Status */
    .status-bar { font-size: 13px; color: #666; text-align: center; margin-bottom: 16px; }
    .status-bar.error { color: #ef4444; }

    /* Add account btn */
    .add-btn {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px dashed #2a2a3a;
      color: #555;
      border-radius: 12px;
      padding: 14px;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: border-color .2s, color .2s;
      margin-top: 8px;
    }
    .add-btn:hover { border-color: #7c6ff7; color: #7c6ff7; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">🧬</div>
    <div class="brand">Financial <span>DNA</span></div>
  </div>

  <h1 id="welcomeMsg">Your Dashboard</h1>
  <p class="sub" id="statusBar">Loading transactions…</p>

  <div class="net-worth">
    <div class="nw-label">Total balance</div>
    <div class="nw-amount" id="netWorth">—</div>
    <div class="nw-sub" id="nwSub">calculating…</div>
  </div>

  <div id="accountsContainer"></div>

  <button class="add-btn" onclick="window.location.href='join-railway.html'">
    + Connect another account
  </button>

<script>
  const SERVER   = 'https://plaid-backend-production-b1ff.up.railway.app';
  const name     = sessionStorage.getItem('fdna_name') || '';
  const item_id  = sessionStorage.getItem('fdna_item_id') || '';
  const source   = sessionStorage.getItem('fdna_db_source') || 'railway';
  const accounts = JSON.parse(sessionStorage.getItem('fdna_accounts') || '[]');

  if (name) document.getElementById('welcomeMsg').textContent = `${name}'s Dashboard`;

  function fmt$(n) {
    if (n == null) return '—';
    return '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtDate(str) {
    if (!str) return '—';
    const [y, m, d] = str.split('-');
    return `${m}/${d}`;
  }
  function truncate(str, n) {
    return str && str.length > n ? str.slice(0, n) + '…' : str;
  }

  function renderAccountBlock(acct, txns) {
    const bal = acct.balances?.current ?? null;
    const isNeg = bal < 0;
    const isCredit = acct.type === 'credit';

    // For credit, current balance = amount owed (show as negative concept)
    const displayBal = bal;
    const balClass = isCredit ? 'negative' : '';

    const block = document.createElement('div');
    block.className = 'acct-block';

    // Header
    const header = document.createElement('div');
    header.className = 'acct-header';
    header.innerHTML = `
      <div>
        <div class="acct-name-big">${acct.name}</div>
        <div class="acct-meta">${acct.subtype}${acct.mask ? ' ····' + acct.mask : ''}</div>
      </div>
      <div class="acct-bal-big ${balClass}">${fmt$(displayBal)}</div>
    `;
    block.appendChild(header);

    const hr = document.createElement('hr');
    hr.className = 'section-divider';
    block.appendChild(hr);

    // Table
    const table = document.createElement('table');
    table.className = 'tx-table';
    table.innerHTML = `
      <thead>
        <tr>
          <th>Merchant</th>
          <th>Date</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="tbody-${acct.account_id}"></tbody>
    `;
    block.appendChild(table);

    const tbody = table.querySelector('tbody');

    if (!txns || txns.length === 0) {
      tbody.innerHTML = '<tr class="loading-row"><td colspan="3">No recent transactions</td></tr>';
    } else {
      txns.slice(0, 10).forEach(tx => {
        const isCredit = tx.amount < 0; // Plaid: positive = debit, negative = credit/refund
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <div class="tx-name">${truncate(tx.merchant_name || tx.name, 32)}${tx.pending ? '<span class="tx-pending">pending</span>' : ''}</div>
            <div class="tx-cat">${(tx.personal_finance_category?.primary || tx.category?.[0] || '').toLowerCase().replace(/_/g, ' ')}</div>
          </td>
          <td class="tx-date">${fmtDate(tx.date)}</td>
          <td class="tx-amt ${isCredit ? 'credit' : 'debit'}">${isCredit ? '+' : ''}${fmt$(tx.amount)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    return block;
  }

  async function loadDashboard() {
    const statusEl = document.getElementById('statusBar');

    // Compute net worth from sessionStorage accounts
    if (accounts.length) {
      let total = 0;
      accounts.forEach(a => { if (a.balances?.current != null) total += a.balances.current; });
      document.getElementById('netWorth').textContent = fmt$(total);
      document.getElementById('nwSub').textContent = `Across ${accounts.length} account${accounts.length === 1 ? '' : 's'}`;
    }

    if (!item_id) {
      statusEl.textContent = 'No session data — reconnect your bank to see transactions.';
      statusEl.className = 'sub status-bar error';

      // Render accounts without transactions if we have them from session
      if (accounts.length) {
        const container = document.getElementById('accountsContainer');
        accounts.forEach(acct => container.appendChild(renderAccountBlock(acct, [])));
      }
      return;
    }

    try {
      statusEl.textContent = 'Fetching transactions from Plaid…';
      const res = await fetch(`${SERVER}/${source}/transactions`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id, source }),
      });
      const data = await res.json();
      if (data.error) throw new Error(JSON.stringify(data.error));

      const { transactions, accounts: plaidAccounts } = data;

      // Group transactions by account_id
      const byAccount = {};
      transactions.forEach(tx => {
        if (!byAccount[tx.account_id]) byAccount[tx.account_id] = [];
        byAccount[tx.account_id].push(tx);
      });

      // Sort each account's txns by date desc
      Object.values(byAccount).forEach(arr => arr.sort((a, b) => b.date.localeCompare(a.date)));

      const container = document.getElementById('accountsContainer');
      container.innerHTML = '';

      // Use Plaid accounts (fresher data) if available, else session accounts
      const acctList = plaidAccounts?.length ? plaidAccounts : accounts;

      // Recompute net worth with fresh data
      if (plaidAccounts?.length) {
        let total = 0;
        plaidAccounts.forEach(a => { if (a.balances?.current != null) total += a.balances.current; });
        document.getElementById('netWorth').textContent = fmt$(total);
        document.getElementById('nwSub').textContent = `Across ${plaidAccounts.length} account${plaidAccounts.length === 1 ? '' : 's'}`;
      }

      acctList.forEach(acct => {
        const txns = byAccount[acct.account_id] || [];
        container.appendChild(renderAccountBlock(acct, txns));
      });

      const total = transactions.length;
      statusEl.textContent = `Last 90 days · ${total} transaction${total === 1 ? '' : 's'} loaded`;
      statusEl.className = 'sub';

    } catch (err) {
      statusEl.textContent = 'Could not load transactions: ' + (err.message || 'unknown error');
      statusEl.className = 'sub status-bar error';
      // Still render accounts without txns
      if (accounts.length) {
        const container = document.getElementById('accountsContainer');
        accounts.forEach(acct => container.appendChild(renderAccountBlock(acct, [])));
      }
    }
  }

  loadDashboard();
</script>
</body>
</html>
